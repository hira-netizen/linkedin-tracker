<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leads Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07090f; --surface: #0d1120; --surface2: #111827;
      --border: #1a2436; --border2: #243044;
      --text: #e8edf5; --text2: #7a8fa8; --text3: #3d4f63;
      --accent: #3b82f6; --green: #10b981; --amber: #f59e0b;
      --pink: #ec4899; --purple: #8b5cf6; --red: #ef4444;
      --orange: #f97316; --li: #0077b5; --ig: #e1306c; --fb: #7c3aed;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; }

    header { background: linear-gradient(180deg,#0d1525 0%,#07090f 100%); border-bottom: 1px solid var(--border); padding: 18px 28px; position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(135deg,#6366f1,#ec4899); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    h1 { font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; }
    h1 span { color: var(--accent); }
    .header-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
    .sheets-badge { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--text2); cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .sheets-badge:hover { border-color: var(--accent); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); transition: all 0.3s; }
    .sheets-badge.connected .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }

    /* REMINDER BANNERS */
    .reminder-area { max-width: 1000px; margin: 14px auto 0; padding: 0 20px; display: flex; flex-direction: column; gap: 8px; }
    .rbox { border-radius: 12px; padding: 11px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: opacity 0.2s; }
    .rbox:hover { opacity: 0.9; }
    .rbox.r-fu1   { background: linear-gradient(135deg,#f97316,#ef4444); }
    .rbox.r-final { background: linear-gradient(135deg,#8b5cf6,#ec4899); }
    .rbox .r-text { flex: 1; }
    .rbox .r-title { font-size: 13px; font-weight: 600; color: #fff; }
    .rbox .r-names { font-size: 11px; color: rgba(255,255,255,.8); margin-top: 2px; }
    .rbox .r-badge { background: rgba(255,255,255,.25); color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 12px; font-weight: 700; flex-shrink: 0; }

    .main-tabs { max-width: 1000px; margin: 0 auto; padding: 18px 20px 0; display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
    .main-tab { padding: 9px 20px; font-size: 13px; font-weight: 500; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; margin-bottom: -1px; }
    .main-tab:hover { color: var(--text2); }
    .main-tab.active { color: var(--text); border-bottom-color: var(--accent); }

    main { max-width: 1000px; margin: 0 auto; padding: 22px 20px; }

    /* CONFIG */
    .config-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 24px; margin-bottom: 20px; display: none; }
    .config-panel.open { display: block; }
    .config-panel h3 { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 14px; }
    .step { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--text2); line-height: 1.5; margin-bottom: 10px; }
    .step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--border2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--accent); flex-shrink: 0; margin-top: 1px; }
    .step code { background: var(--surface2); border: 1px solid var(--border2); border-radius: 4px; padding: 1px 6px; font-family: 'Space Mono', monospace; font-size: 11px; color: var(--pink); }
    .script-box { background: var(--bg); border: 1px solid var(--border2); border-radius: 10px; padding: 14px 16px; margin: 14px 0; position: relative; }
    .script-box pre { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text2); white-space: pre-wrap; word-break: break-all; line-height: 1.7; max-height: 220px; overflow-y: auto; }
    .copy-btn { position: absolute; top: 10px; right: 10px; background: var(--border2); border: none; border-radius: 6px; padding: 4px 10px; color: var(--text2); font-size: 11px; cursor: pointer; transition: all 0.2s; }
    .copy-btn:hover { background: var(--accent); color: #fff; }
    .config-input-row { display: flex; gap: 10px; margin-top: 4px; }
    .config-input { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 9px; padding: 10px 14px; color: var(--text); font-size: 13px; font-family: 'Space Mono', monospace; outline: none; }
    .config-input:focus { border-color: var(--accent); }
    .config-input::placeholder { color: var(--text3); }
    .btn-save-config { background: var(--accent); border: none; border-radius: 9px; padding: 10px 20px; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .config-msg { font-size: 12px; margin-top: 8px; }

    /* ADD FORM */
    .add-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 22px; margin-bottom: 20px; }
    .add-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px; }
    .add-row { display: grid; gap: 10px; margin-bottom: 8px; }
    .add-row.r1 { grid-template-columns: 1fr auto auto; }
    .add-row.r2 { grid-template-columns: 1fr 1fr; }
    .add-row.r3 { grid-template-columns: 1fr auto; }

    .inp { background: var(--bg); border: 1px solid var(--border2); border-radius: 10px; padding: 11px 14px; color: var(--text); font-size: 14px; outline: none; transition: border .2s; width: 100%; font-family: 'Outfit', sans-serif; }
    .inp:focus { border-color: var(--accent); }
    .inp::placeholder { color: var(--text3); }
    .inp.sm { font-size: 13px; }
    .inp.err { border-color: var(--red); }

    /* bio paste box */
    .bio-box { background: var(--bg); border: 1px solid var(--border2); border-radius: 10px; padding: 10px 14px; color: var(--text2); font-size: 12px; outline: none; transition: border .2s; width: 100%; font-family: 'Outfit', sans-serif; resize: none; min-height: 56px; }
    .bio-box:focus { border-color: var(--accent); }
    .bio-box::placeholder { color: var(--text3); font-size: 12px; }
    .bio-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }

    /* source / detect badges */
    .src-detect { background: var(--bg); border: 1px solid var(--border2); border-radius: 10px; padding: 11px 14px; font-size: 13px; color: var(--text3); display: flex; align-items: center; gap: 7px; user-select: none; white-space: nowrap; }
    .src-detect.li { border-color: var(--li); color: var(--li); background: #0077b511; }
    .src-detect.ig { border-color: var(--ig); color: var(--ig); background: #e1306c11; }
    .src-detect.fb { border-color: var(--fb); color: var(--fb); background: #1877f211; }

    /* niche detected chip */
    .niche-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; background: #8b5cf622; border: 1px solid var(--purple); border-radius: 20px; font-size: 12px; color: var(--purple); font-weight: 500; margin-top: 6px; }
    .niche-chip .x { cursor: pointer; color: var(--text3); margin-left: 2px; }
    .niche-chip .x:hover { color: var(--red); }

    /* sel wrap */
    .sel-wrap { position: relative; }
    .sel-wrap select { background: var(--bg); border: 1px solid var(--border2); border-radius: 10px; padding: 11px 32px 11px 14px; color: var(--text); font-size: 13px; font-family: 'Outfit', sans-serif; outline: none; cursor: pointer; appearance: none; -webkit-appearance: none; width: 100%; transition: border .2s; }
    .sel-wrap select:focus { border-color: var(--accent); }
    .sel-wrap::after { content: '▾'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; font-size: 12px; }

    .btn-add { background: linear-gradient(135deg,#6366f1,#8b5cf6); border: none; border-radius: 10px; padding: 11px 22px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity .2s; align-self: start; }
    .btn-add:hover { opacity: .85; }
    .msg { font-size: 12px; margin-top: 8px; }
    .msg.err { color: var(--red); } .msg.ok { color: var(--green); } .msg.info { color: var(--accent); }

    /* STATS */
    .stats { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 9px 16px; display: flex; align-items: center; gap: 7px; }
    .stat-val { font-family: 'Space Mono', monospace; font-size: 20px; font-weight: 700; }
    .stat-lbl { font-size: 11px; color: var(--text3); }

    /* FILTER ROWS */
    .src-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .sp { display: flex; align-items: center; gap: 5px; padding: 5px 13px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); color: var(--text3); background: transparent; transition: all .15s; }
    .sp:hover { border-color: var(--border2); color: var(--text2); }
    .sp.a-all { background: var(--surface2); border-color: var(--border2); color: var(--text); }
    .sp.a-li  { background: #0077b522; border-color: var(--li); color: var(--li); }
    .sp.a-ig  { background: #e1306c22; border-color: var(--ig); color: var(--ig); }
    .sp.a-fb  { background: #7c3aed22; border-color: #7c3aed; color: #7c3aed; }
    .sf-row { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
    .fbtn { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 4px 11px; color: var(--text3); font-size: 11px; font-weight: 500; cursor: pointer; transition: all .15s; }
    .fbtn.active { background: var(--surface2); border-color: var(--border2); color: var(--text); }
    .fbtn:hover { border-color: var(--border2); color: var(--text2); }
    .fbtn.fu1-f  { border-color: var(--orange); color: var(--orange); }
    .fbtn.fu1-f.active  { background: #f9731622; }
    .fbtn.fin-f  { border-color: var(--purple); color: var(--purple); }
    .fbtn.fin-f.active  { background: #8b5cf622; }

    /* BADGES */
    .src-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 600; }
    .b-li { background: #0077b522; color: var(--li); }
    .b-ig { background: #e1306c22; color: var(--ig); }
    .b-fb { background: #7c3aed22; color: #7c3aed; }
    .eng-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 600; }
